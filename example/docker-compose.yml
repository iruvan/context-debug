# A seeded Postgres for the example — the table and rows in db/init.sql are
# created on first start, so there's nothing to set up by hand.
#
# Also brings up an NSQ cluster (nsqlookupd, nsqd, nsqadmin) for experimenting
# with context-debug on the consumer side.
#
#   make run   # start this, then run the service on your machine
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: contextdebug
    ports:
      # 5433 on the host, so it doesn't collide with a local Postgres.
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Named so `make down` keeps the data and `make clean` drops it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d contextdebug"]
      interval: 2s
      timeout: 3s
      retries: 15

  nsqlookupd:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd
    ports:
      - "4160:4160" # TCP: nsqd registration
      - "4161:4161" # HTTP: lookup API

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150" # TCP: pub/sub
      - "4151:4151" # HTTP: pub/stats API
    volumes:
      - nsqdata:/data

  nsqadmin:
    image: nsqio/nsq:v1.3.0
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "4171:4171" # web UI: http://localhost:4171

volumes:
  pgdata:
  nsqdata:
